<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"
     aria-label="A research session as a tree of states: load once, snapshot, fan out a map, try a change in a fork, adopt it, roll back at any time">
  <title>Talo: a session as a tree of states</title>
  <style>
    text { font-family: "Latin Modern Roman", "CMU Serif", "Computer Modern", Georgia, "Times New Roman", serif; fill: #1f2937; }
    .small { font-size: 12.5px; }
    .label { font-size: 14.5px; }
    .note { font-size: 12px; font-style: italic; fill: #4b5563; }
    .time { font-size: 12px; fill: #6b7280; }
    .state { fill: #e8eef9; stroke: #374151; stroke-width: 1.2; }
    .live { fill: #dcefdc; stroke: #374151; stroke-width: 1.6; }
    .trial { fill: #fff7d6; stroke: #374151; stroke-width: 1.2; }
    .case { fill: #fff7d6; stroke: #374151; stroke-width: 1; }
    .ledger { fill: #efe6f7; stroke: #374151; stroke-width: 1.2; }
    .edge { stroke: #374151; stroke-width: 1.3; fill: none; }
    .fork { stroke: #374151; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
    .back { stroke: #b45309; stroke-width: 1.3; fill: none; stroke-dasharray: 6 3; }
    .head { fill: #374151; }
    .headback { fill: #b45309; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .note, .time { fill: #9ca3af; }
      .state { fill: #1e2a3d; stroke: #9ca3af; }
      .live { fill: #183222; stroke: #d1d5db; }
      .trial, .case { fill: #33300f; stroke: #9ca3af; }
      .ledger { fill: #2a1f36; stroke: #9ca3af; }
      .edge, .fork { stroke: #9ca3af; }
      .head { fill: #9ca3af; }
      .back { stroke: #f59e0b; }
      .headback { fill: #f59e0b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="head"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="headback"/>
    </marker>
  </defs>

  <!-- main line of the session -->
  <circle class="state" cx="40" cy="170" r="14"/>
  <text class="small" x="40" y="205" text-anchor="middle">empty</text>
  <path class="edge" d="M54,170 L146,170" marker-end="url(#a)"/>
  <text class="label" x="100" y="160" text-anchor="middle">load</text>
  <text class="time" x="100" y="190" text-anchor="middle">once, 13 s</text>

  <rect class="state" x="150" y="150" width="100" height="40" rx="8"/>
  <text class="label" x="200" y="175" text-anchor="middle">loaded</text>

  <path class="edge" d="M250,170 L436,170" marker-end="url(#a)"/>
  <text class="label" x="343" y="160" text-anchor="middle">run --trial clean</text>
  <text class="time" x="343" y="190" text-anchor="middle">in a fork</text>
  <text class="note" x="343" y="210" text-anchor="middle">the session stays usable</text>

  <rect class="trial" x="440" y="150" width="120" height="40" rx="8"/>
  <text class="label" x="500" y="175" text-anchor="middle">trial-clean</text>
  <text class="note" x="500" y="210" text-anchor="middle">review: what changed</text>

  <path class="edge" d="M560,170 L686,170" marker-end="url(#a)"/>
  <text class="label" x="623" y="160" text-anchor="middle">adopt</text>
  <text class="time" x="623" y="190" text-anchor="middle">1 s, atomic</text>

  <rect class="live" x="690" y="150" width="120" height="40" rx="8"/>
  <text class="label" x="750" y="175" text-anchor="middle">live worker</text>
  <text class="note" x="750" y="210" text-anchor="middle">verify: replay = MATCH</text>

  <!-- fan-out from loaded -->
  <rect class="case" x="150" y="270" width="40" height="26" rx="5"/>
  <rect class="case" x="196" y="270" width="40" height="26" rx="5"/>
  <rect class="case" x="242" y="270" width="40" height="26" rx="5"/>
  <text class="small" x="300" y="288">…</text>
  <rect class="case" x="318" y="270" width="40" height="26" rx="5"/>
  <text class="small" x="170" y="287" text-anchor="middle">0</text>
  <text class="small" x="216" y="287" text-anchor="middle">1</text>
  <text class="small" x="262" y="287" text-anchor="middle">2</text>
  <text class="small" x="338" y="287" text-anchor="middle">38</text>
  <path class="fork" d="M180,190 L170,268" marker-end="url(#a)"/>
  <path class="fork" d="M195,190 L214,268" marker-end="url(#a)"/>
  <path class="fork" d="M210,190 L258,268" marker-end="url(#a)"/>
  <path class="fork" d="M230,190 L332,268" marker-end="url(#a)"/>
  <text class="label" x="88" y="250" text-anchor="middle">map, 13 at once</text>
  <text class="time" x="88" y="266" text-anchor="middle">39 cases, 3.2 s</text>
  <text class="note" x="254" y="318" text-anchor="middle">each case: a fork of "loaded", only changed pages copied</text>

  <rect class="ledger" x="440" y="264" width="160" height="38" rx="8"/>
  <text class="label" x="520" y="288" text-anchor="middle">ledger: rank IC × 39</text>
  <path class="edge" d="M360,283 L438,283" marker-end="url(#a)"/>
  <text class="small" x="399" y="275" text-anchor="middle">record</text>

  <!-- rollback -->
  <path class="back" d="M750,150 C750,85 260,75 210,148" marker-end="url(#b)"/>
  <text class="label" x="480" y="64" text-anchor="middle">undo · checkout loaded</text>
  <text class="time" x="480" y="82" text-anchor="middle">back to any state, well under a second</text>
  <text class="note" x="196" y="140" text-anchor="end">snap: 0.01 s</text>

  <!-- datasets / other sessions -->
  <path class="fork" d="M810,170 C850,170 860,240 850,280" marker-end="url(#a)"/>
  <rect class="ledger" x="760" y="284" width="130" height="38" rx="8"/>
  <text class="label" x="825" y="308" text-anchor="middle">publish panel v2</text>
  <text class="note" x="825" y="345" text-anchor="middle">other sessions: talo.get,</text>
  <text class="note" x="825" y="360" text-anchor="middle">mapped, not copied</text>

  <text class="note" x="20" y="365">times measured on a 2.4 GB futures panel (18 factors × 53 contracts, 5 years)</text>
</svg>
